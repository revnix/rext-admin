name: pr-checks

# The checks a pull request into main (the base since 2026-10-07) or staging runs. On every push: the route types,
# the type check, Biome, and the token and layout checks once they exist; and Jest, the production build, and the
# accessibility checks and the performance budgets against that build, while the repository is public.
#
# Actions minutes cost nothing on a public repository. On a private one the organisation's Free plan shares 2,000
# minutes a month with the deploy workflows, so there Jest and the build run only when the pull request has the label
# "build" (the founder's decision of 2026-10-06), and rext-control/scripts/app/check.sh runs them before every merge.
# One job, one install; a newer push cancels the run before it.

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  # A label other than "build" gets a group of its own, so adding it cancels nothing.
  group: pr-checks-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'build') && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  checks:
    # Adding a label other than "build" changes no code: nothing to run.
    if: github.event.action != 'labeled' || github.event.label.name == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Everything on a public repository; Jest and the build only with the label "build" on a private one.
      FULL: ${{ github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'build') }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Route types
        run: pnpm exec next typegen
        env:
          # next typegen loads next.config.ts, which checks the environment as a production build does (env.ts).
          # Dummy values, as in the build below.
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:2024
          AUTH_SECRET: ci-build-only-not-a-secret

      - name: API types match the spec
        # lib/api-client/schema.d.ts is generated from api/openapi.json, the backend's spec (pnpm api:types).
        run: pnpm api:types && git diff --exit-code -- lib/api-client/schema.d.ts

      - name: Types
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tokens and layout
        # The design-token and layout checks (tasks B3 and C2) run as soon as package.json has them, as check.sh does.
        run: |
          for script in tokens:check layout:check; do
            if grep -q "\"$script\":" package.json; then pnpm run "$script"; else echo "$script: not in package.json yet"; fi
          done

      - name: Tests
        if: env.FULL == 'true'
        run: pnpm exec jest --ci --silent
        env:
          CI: "true"

      - name: Restore the build cache
        if: env.FULL == 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'hooks/**', 'stores/**', 'providers/**', 'services/**', 'schemas/**', 'types/**', 'next.config.ts', 'proxy.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: The build's environment
        # Dummy values for the build and the checks that start it: they need the names, never a real address
        # or key. Nothing answers at the backend's address, so those checks open only pages that need none.
        # REXT_DEV_PAGES serves /dev/primitives from this build, for the accessibility checks
        # (lib/dev-pages.ts); the deploys never set it.
        if: env.FULL == 'true'
        run: |
          {
            echo "NEXT_TELEMETRY_DISABLED=1"
            echo "NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:2024"
            echo "NEXT_PUBLIC_BACKEND_API_URL=http://127.0.0.1:2024"
            echo "BACKEND_API_URL=http://127.0.0.1:2024"
            echo "LANGGRAPH_API_URL=http://127.0.0.1:2024"
            echo "AUTH_SECRET=ci-build-only-not-a-secret"
            echo "AUTH_URL=http://localhost:3000"
            echo "AUTH_TRUST_HOST=true"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "REXT_DEV_PAGES=1"
          } >> "$GITHUB_ENV"

      - name: Build
        id: build
        if: env.FULL == 'true'
        run: pnpm build

      - name: The browser for the accessibility checks
        if: env.FULL == 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Accessibility
        # Task C10 (design/app-language.md §11 and §12), on the build above: axe at WCAG 2.2 AA (target size
        # included), the tab order (every focused element visible, ringed and not covered), and no moving
        # animation with reduced motion. The pages are those that render without a backend: the signed-out
        # pages and /dev/primitives (e2e/a11y/routes.ts).
        if: env.FULL == 'true'
        run: pnpm a11y

      - name: Performance budgets
        # Lighthouse CI on five of those pages (lighthouserc.json): LCP 2.5 s, CLS 0.1, and TBT 200 ms, the
        # lab's stand-in for INP. It reports whether or not the accessibility checks passed. Each page loads
        # three times and each metric's own median is judged ("median", not "median-run", which checks
        # every metric against one run chosen by its score: on 2026-10-07 that was the job's first,
        # cold load of /login, at 262 ms TBT against 24 and 29 for the other two).
        if: env.FULL == 'true' && !cancelled() && steps.build.outcome == 'success'
        run: pnpm perf

      - name: Keep the reports of a failed check
        if: failure() && env.FULL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: a11y-and-performance-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-reports/
          retention-days: 7
          if-no-files-found: ignore
